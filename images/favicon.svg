<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12372A" />
      <stop offset="100%" stop-color="#0A1914" />
    </linearGradient>
    
    <!-- Sun Solar Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE181" />
      <stop offset="50%" stop-color="#E0A92D" />
      <stop offset="100%" stop-color="#C59020" />
    </linearGradient>

    <!-- Solar Rays Outer Gradient -->
    <linearGradient id="ray-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE181" />
      <stop offset="100%" stop-color="#E0A92D" />
    </linearGradient>

    <!-- Subtle Glow Effect -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#E0A92D" stroke-width="8" stroke-opacity="0.3" />

  <!-- Outer Solar Dash Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 8" />

  <!-- Sun Rays (16 Geometric Rays) -->
  <g stroke="url(#ray-grad)" stroke-width="16" stroke-linecap="round" filter="url(#gold-glow)">
    <!-- Cardinal Directions -->
    <line x1="256" y1="72" x2="256" y2="112" />
    <line x1="256" y1="400" x2="256" y2="440" />
    <line x1="72" y1="256" x2="112" y2="256" />
    <line x1="400" y1="256" x2="440" y2="256" />

    <!-- 45-Degree Diagonals -->
    <line x1="126" y1="126" x2="154" y2="154" />
    <line x1="358" y1="358" x2="386" y2="386" />
    <line x1="126" y1="386" x2="154" y2="358" />
    <line x1="358" y1="154" x2="386" y2="126" />

    <!-- Intermediate Rays -->
    <line x1="184" y1="92" x2="202" y2="123" />
    <line x1="328" y1="389" x2="310" y2="358" />
    <line x1="92" y1="184" x2="123" y2="202" />
    <line x1="389" y1="328" x2="358" y2="310" />

    <line x1="328" y1="92" x2="310" y2="123" />
    <line x1="184" y1="389" x2="202" y2="358" />
    <line x1="420" y1="184" x2="389" y2="202" />
    <line x1="92" y1="328" x2="123" y2="310" />
  </g>

  <!-- Central Sun Core -->
  <circle cx="256" cy="256" r="96" fill="url(#gold-grad)" filter="url(#gold-glow)" />

  <!-- Inner Geometric Photovoltaic Diamond Motif -->
  <path d="M 256 186 L 326 256 L 256 326 L 186 256 Z" fill="#12372A" opacity="0.85" />
  <circle cx="256" cy="256" r="32" fill="url(#gold-grad)" />
</svg>
